<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>No-Camera CAPTCHA</title>
  <link rel="stylesheet" href="../css/nocamera_index.css">
</head>
<body>
  <canvas id="testCanvas"></canvas>

  <!-- 상태바 (처음엔 숨김) -->
  <div id="progressContainer" style="display:none;">
    <div id="successBar"></div>
    <div id="failBar"></div>
    <span id="barText">성공 0 / 실패 0</span>
  </div>

  <div id="startContainer">
    <button id="startBtn">시작</button>
    <div id="instruction">
      버튼을 눌러 캡차 테스트를 시작하세요 <br>
      신호음에 맞춰 점을 클릭하세요
    </div>
  </div>

  <!-- 성공 모달 -->
  <div id="successModal" style="display:none; position:fixed; top:0; left:0;
    width:100%; height:100%; background:rgba(0,0,0,0.5);
    justify-content:center; align-items:center; z-index:9999;">
    <div style="background:#fff; padding:20px; border-radius:12px; max-width:400px; text-align:center;">
      <h3>✅ 인증성공</h3>
      <p>대체 인증 방법을 통과했습니다.</p>
      <!-- <button id="yesBtn">Continue</button>
      <button id="noBtn">No</button> -->
    </div>
  </div>

  <div id="failModal" style="display:none; position:fixed; top:0; left:0;
    width:100%; height:100%; background:rgba(0,0,0,0.5);
    justify-content:center; align-items:center; z-index:9999;">
  <div style="background:#fff; padding:20px; border-radius:12px; max-width:400px; text-align:center;">
      <h3>❌인증실패</h3>
      <p>허용된 시도 횟수 내에 인증을 완료하지 못했습니다.<br>다시 시도하시겠습니까?</p>
      <button id="retryBtn">Retry</button>
  </div>
</div>

  <script src="nocamera_index.js"></script>
</body>
</html>
