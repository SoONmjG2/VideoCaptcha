<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>클릭 기반 CAPTCHA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- ✅ 공통 스타일 (시선 버전과 동일) -->
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/noseeso_index.css" />

  <!-- ✅ reCAPTCHA Site Key 자동 분기 -->
  <script>
    const host = window.location.hostname;
    window.__RECAPTCHA_KEY =
      (host.includes("localhost") || host.includes("127.0.0.1"))
        ? "6Le1PforAAAAAKExXZqDKIl1ukayF6E7cqaGVUut"
        : "6LcspMwrAAAAAP5C_hIutqsKG3sLqNDKY9ZL67vU";

    console.log("✅ reCAPTCHA site key:", window.__RECAPTCHA_KEY);
  </script>

  <!-- ✅ reCAPTCHA script -->
  <script id="recaptcha-script" async defer></script>
  <script>
    document.getElementById("recaptcha-script").src =
      `https://www.google.com/recaptcha/api.js?render=${window.__RECAPTCHA_KEY}`;
  </script>

  <!-- ✅ reCAPTCHA token 준비 -->
  <script>
    window.addEventListener("load", () => {
      function init() {
        if (!window.grecaptcha) return;
        grecaptcha.ready(() => {
          grecaptcha.execute(window.__RECAPTCHA_KEY, { action: "submit" })
            .then((token) => {
              console.log("🎯 reCAPTCHA token:", token);
              window.__RECAPTCHA_TOKEN = token;
            });
        });
      }
      if (window.grecaptcha) init();
      else {
        const t = setInterval(() => {
          if (window.grecaptcha) { clearInterval(t); init(); }
        }, 200);
      }
    });
  </script>
</head>

<body>
  <!-- 🎥 비디오 영역 -->
  <div class="video-container">
    <div class="overlay-text" id="overlayText">로딩중...</div>

    <video id="myVideo" width="640" height="360" autoplay muted loop playsinline>
      브라우저가 video 태그를 지원하지 않습니다.
    </video>
  </div>

  <!-- ✅ 클릭 좌표 표시용 캔버스 -->
  <canvas id="preview" style="position:fixed;"></canvas>
  <canvas id="output" style="position:fixed; display:none;"></canvas>

  <!-- 🎮 버튼 -->
  <div class="container" style="text-align:center; margin-top:20px;">
    <button id="submitButton" style="padding:10px 20px; font-size:16px;">제출</button>
    <button id="resetButton" style="padding:10px 20px; font-size:16px; margin-left:10px;">다시하기</button>
  </div>

  <!-- ✅ 클릭 CAPTCHA 로직 -->
  <script src="./noseeso_index.js"></script>

  <!-- 🎞️ 로딩 후 비디오 표시 -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      document.querySelector(".video-container").classList.add("show");
    });
  </script>
</body>
</html>
