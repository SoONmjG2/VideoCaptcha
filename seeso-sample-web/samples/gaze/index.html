<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>SeeSo Web Sample</title>
  <link rel="stylesheet" href="../../css/main.css" />

  <script>
    /**************************************************
     * ✅ 1️⃣ 도메인별 site key 자동 분기
     *  - 로컬: localhost / 127.0.0.1 → 테스트 키
     *  - 배포: https://peachprmoise.co.kr → 실제 키
     **************************************************/
    const host = window.location.hostname;
    if (host.includes("localhost") || host.includes("127.0.0.1")) {
      window.__RECAPTCHA_KEY = "6Le1PforAAAAAKExXZqDKIl1ukayF6E7cqaGVUut"; // 로컬용
    } else {
      window.__RECAPTCHA_KEY = "6LcspMwrAAAAAP5C_hIutqsKG3sLqNDKY9ZL67vU"; // Render/배포용
    }
    console.log("✅ reCAPTCHA site key loaded:", window.__RECAPTCHA_KEY);
  </script>

  <!-- ✅ 2️⃣ render 파라미터는 site key 동적으로 연결 -->
  <script id="recaptcha-script" async defer></script>
  <script>
    const script = document.getElementById("recaptcha-script");
    script.src = `https://www.google.com/recaptcha/api.js?render=${window.__RECAPTCHA_KEY}`;
  </script>

  <script>
    /**************************************************
     * ✅ 3️⃣ 토큰 생성 및 전역 저장
     **************************************************/
    window.addEventListener("load", function() {
      if (!window.grecaptcha) {
        console.error("⚠️ reCAPTCHA 라이브러리 로드 실패");
        return;
      }
      grecaptcha.ready(() => {
        console.log("✅ reCAPTCHA 준비 완료");
        grecaptcha.execute(window.__RECAPTCHA_KEY, { action: "submit" })
          .then((token) => {
            console.log("🎯 reCAPTCHA token 생성 성공:", token);
            window.__RECAPTCHA_TOKEN = token;
          })
          .catch(err => console.error("❌ reCAPTCHA 실행 오류:", err));
      });
    });
  </script>
</head>

<body>
  <div class="video-container">
    <div class="overlay-text" id="overlayText">로딩중..</div>
    <video id="myVideo" loop autoplay muted width="640" height="360">
      브라우저가 video 태그를 지원하지 않습니다.
    </video>
  </div>

  <canvas id="preview" style="position: fixed;"></canvas>
  <canvas id="output" style="position: fixed; display: none;"></canvas>

  <h1 id="calibrationTitle" style="text-align: center;">Calibration Service</h1>
  <h2 id="gazeInfo" style="text-align: center; color: red;"></h2>

  <div class="container" style="text-align: center; margin-top: 20px;">
    <button id="calibrationButton" style="padding:10px 20px;font-size:16px;">Start Calibration</button>
    <input type="file" id="jsonUploader" accept=".json" multiple style="display:none;" />
    <button id="uploadButton" style="padding:10px 20px;font-size:16px;display:none;">파일 선택</button>
    <button id="drawButton" style="padding:10px 20px;font-size:16px;display:none;">그리기</button>
    <button id="cancelDrawButton" style="padding:10px 20px;font-size:16px;display:none;">그리기 취소</button>
    <span id="uploadName" style="display:none;"></span>
    <button id="saveDataButton" style="padding:10px 20px;font-size:16px;margin-left:10px;display:none;">Save &amp; Play</button>
    <button id="ptlayDataButon" style="padding:10px 20px;font-size:16px;margin-left:10px;display:none;">Play Gaze Data</button>
    <button id="submitButton" style="position:fixed;right:24px;bottom:24px;z-index:10001">제출</button>
    <button id="resetButton" style="position:fixed;right:120px;bottom:24px;z-index:10001">다시하기</button>
  </div>

  <script src="./index.js"></script>
</body>
</html>
