<!-- samples/gaze/user_index.html -->
<!doctype html>
<html class="no-js" lang="ko">
<head>
  <meta charset="utf-8" />
  <title>시선 기반 CAPTCHA</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/user_index.css" />

  <!-- ✅ reCAPTCHA Site Key 설정 -->
  <script>
    // Google reCAPTCHA v3 site key — (네가 발급받은 key)
    window.__RECAPTCHA_KEY = "6Le1PforAAAAAKExXZqDKIl1ukayF6E7cqaGVUut";
    console.log("✅ reCAPTCHA site key loaded:", window.__RECAPTCHA_KEY);
  </script>

  <!-- ✅ reCAPTCHA API 불러오기 (render=siteKey 필수) -->
  <script src="https://www.google.com/recaptcha/api.js?render=6Le1PforAAAAAKExXZqDKIl1ukayF6E7cqaGVUut" async defer></script>

  <!-- ✅ 토큰 자동 생성 로직 -->
  <script>
    window.addEventListener("load", function() {
      // reCAPTCHA 라이브러리가 정상 로드되었는지 확인
      if (!window.grecaptcha) {
        console.error("⚠️ reCAPTCHA 라이브러리 로드 실패");
        return;
      }

      // grecaptcha 준비 후 실행
      grecaptcha.ready(() => {
        console.log("✅ reCAPTCHA 준비 완료");
        grecaptcha.execute(window.__RECAPTCHA_KEY, { action: "submit" })
          .then(token => {
            console.log("🎯 reCAPTCHA token 생성 성공:", token);
            // 전역에 저장해서 user_index.js에서 접근 가능하도록
            window.__RECAPTCHA_TOKEN = token;
          })
          .catch(err => {
            console.error("❌ reCAPTCHA 실행 오류:", err);
          });
      });
    });
  </script>
</head>

<body>
  <!-- 처음 안내 화면 -->
  <div class="fade-screen" id="introScreen">
    <p>시선 기록은 저장되지 않으며,<br>로그인 확인을 위한 정답 판정에만 사용됩니다.</p>
  </div>

  <!-- 🎥 영상 컨테이너 -->
  <div class="video-container">
    <div class="overlay-text" id="overlayText">로딩중..</div>

    <video id="myVideo" loop autoplay muted width="640" height="360">
      브라우저가 video 태그를 지원하지 않습니다.
    </video>
  </div>

  <canvas id="preview" style="position: fixed;"></canvas>
  <canvas id="output"  style="position: fixed; display: none;"></canvas>

  <h1 id="calibrationTitle" style="text-align: center; z-index: -1;">Calibration Service</h1>
  <h2 id="gazeInfo" style="text-align: center; color: red;"></h2>

  <div class="container" style="text-align:center; margin-top:20px;">
    <button id="calibrationButton" style="padding:10px 20px; font-size:16px;">Start Calibration</button>

    <button id="submitButton" style="padding:10px 20px; font-size:16px; margin-left:10px;">제출</button>
    <button id="resetButton"  style="padding:10px 20px; font-size:16px; margin-left:10px;">다시하기</button>
  </div>

  <!-- 🎬 시선 추적 로직 -->
  <script src="./user_index.js"></script>

  <script>
    // 인트로 → 비디오 표시
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        document.getElementById("introScreen").classList.add("fade-out");
        document.querySelector(".video-container").classList.add("show");
      }, 3000); // ✅ 3초 후 전환
    });
  </script>
</body>
</html>
